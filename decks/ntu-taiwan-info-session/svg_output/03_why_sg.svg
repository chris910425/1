  <g id="reasons" data-pptx-bounds="48 128 640 560">
    <text x="48" y="232" font-weight="900" font-size="54" fill="#C7CEE4">01</text>
    <text x="128" y="232" font-weight="900" font-size="30" fill="#0A1138">在國際級的職場裡學</text>
    <text x="128" y="268" font-weight="400" font-size="19" fill="#6B6B6B">近年成為亞洲金融中心，</text><text x="128" y="298" font-weight="400" font-size="19" fill="#6B6B6B">許多跨國企業把亞洲總部設在這裡。</text>
    <rect x="48" y="336" width="620" height="2" fill="#C7CEE4"/>
    <text x="48" y="418" font-weight="900" font-size="54" fill="#C7CEE4">02</text>
    <text x="128" y="418" font-weight="900" font-size="30" fill="#0A1138">生活安全、乾淨</text>
    <text x="128" y="454" font-weight="400" font-size="19" fill="#6B6B6B">治安好，公共環境整潔，</text><text x="128" y="484" font-weight="400" font-size="19" fill="#6B6B6B">一個人住也放心。</text>
    <rect x="48" y="522" width="620" height="2" fill="#C7CEE4"/>
    <text x="48" y="604" font-weight="900" font-size="54" fill="#C7CEE4">03</text>
    <text x="128" y="604" font-weight="900" font-size="30" fill="#0A1138">離家 4.5 小時</text>
    <text x="128" y="640" font-weight="400" font-size="19" fill="#6B6B6B">直飛台北，</text><text x="128" y="670" font-weight="400" font-size="19" fill="#6B6B6B">想回去隨時可以。</text>
  </g>

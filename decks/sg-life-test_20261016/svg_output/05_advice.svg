    <text x="240" y="392" font-size="36" font-weight="bold" fill="#121316">每週留一天給自己</text>
    <text x="240" y="426" font-size="20" fill="#6B6D73">別讓專題吞掉所有週末。</text>
  </g>
  <g id="tip-3" data-pptx-bounds="72 450 1136 110">

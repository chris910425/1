    <text x="72" y="474" font-size="20" fill="#6B6D73">課堂與實驗課，<tspan x="72" dy="32">一天從這裡開始。</tspan></text>
  </g>
  <g id="st-lunch" data-pptx-bounds="364 270 262 250">
    <text x="364" y="330" font-family="Arial" font-size="56" font-weight="bold" fill="#2445FF">12:30</text>
    <line x1="364" y1="366" x2="626" y2="366" stroke="#2445FF" stroke-width="2"/>
    <circle cx="373" cy="366" r="9" fill="#2445FF"/>
    <text x="364" y="430" font-size="28" font-weight="bold" fill="#121316">小販中心午餐</text>
    <text x="364" y="474" font-size="20" fill="#6B6D73">選擇多到，<tspan x="364" dy="32">每天都難決定。</tspan></text>

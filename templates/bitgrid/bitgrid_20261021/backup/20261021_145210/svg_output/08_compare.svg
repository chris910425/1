    <text x="110" y="412" font-size="24" fill="#55575E">不需要大家同意，馬上入帳。</text>
    <rect x="64" y="476" width="26" height="26" fill="#FF9EC7" stroke="#0A0A0A" stroke-width="3"/><text x="70" y="496" font-family="Consolas, Microsoft JhengHei" font-size="18" font-weight="bold" fill="#0A0A0A">✖</text>

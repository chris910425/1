    <text x="110" y="240" font-size="32" font-weight="bold" fill="#0A0A0A">一個管理者</text>
    <text x="110" y="282" font-size="24" fill="#55575E">銀行說了算，帳本只有一份。</text>
    <rect x="64" y="346" width="26" height="26" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="70" y="366" font-family="Consolas, Microsoft JhengHei" font-size="18" font-weight="bold" fill="#0A0A0A">✔</text>

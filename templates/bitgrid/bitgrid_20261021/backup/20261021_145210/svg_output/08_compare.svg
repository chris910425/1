    <text x="750" y="282" font-size="24" fill="#55575E">每個節點都有一份帳本。</text>
    <rect x="704" y="346" width="26" height="26" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="710" y="366" font-family="Consolas, Microsoft JhengHei" font-size="18" font-weight="bold" fill="#0A0A0A">✖</text>
    <text x="750" y="370" font-size="32" font-weight="bold" fill="#0A0A0A">慢一點</text>
    <text x="750" y="412" font-size="24" fill="#55575E">需要共識，等幾個區塊。</text>
    <rect x="704" y="476" width="26" height="26" fill="#6FE0EE" stroke="#0A0A0A" stroke-width="3"/><text x="710" y="496" font-family="Consolas, Microsoft JhengHei" font-size="18" font-weight="bold" fill="#0A0A0A">✔</text>
    <text x="750" y="500" font-size="32" font-weight="bold" fill="#0A0A0A">難以竄改</text>
    <text x="750" y="542" font-size="24" fill="#55575E">要改帳得同時騙過多數節點。</text>

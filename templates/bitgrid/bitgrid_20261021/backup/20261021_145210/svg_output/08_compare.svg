    <text x="54" y="144" font-family="Consolas, Microsoft JhengHei" font-size="16" font-weight="bold" fill="#FFFFFF">■ CENTRAL.EXE</text><rect x="574" y="129" width="18" height="16" fill="#F2F2EF" stroke="#0A0A0A" stroke-width="2"/><rect x="550" y="129" width="18" height="16" fill="#F2F2EF" stroke="#0A0A0A" stroke-width="2"/><rect x="526" y="129" width="18" height="16" fill="#F2F2EF" stroke="#0A0A0A" stroke-width="2"/>

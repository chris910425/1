    <text x="860" y="230" font-size="26" fill="#0A0A0A" font-weight="bold">就能證明 TX3 在區塊裡。</text>
    <text x="860" y="300" font-size="20" fill="#333333">不用下載整個區塊：<tspan x="860" dy="31">把 TX3 和兩兩配對的雜湊</tspan><tspan x="860" dy="31">一路算上去，</tspan><tspan x="860" dy="31">結果等於 ROOT 就成立。</tspan></text>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.slide.visible .reveal{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.25s}.d3{transition-delay:.4s}.d4{transition-delay:.55s}
.theme-hint{position:fixed;right:16px;bottom:12px;font:12px monospace;opacity:.45;color:var(--ink);z-index:5}

:root{--paper:#f3f2ee;--ink:#121316;--muted:#6b6d73;--rule:rgba(18,19,22,.14);--accent:#2445ff;--accent-ink:#fff;--stage-bg:var(--paper);--slide-bg:var(--paper)}
:root.dark{--paper:#0b0c10;--ink:#eceef3;--muted:#8a8f9c;--rule:rgba(236,238,243,.14);--accent:#5a72ff;--accent-ink:#0b0c10}
.slide{color:var(--ink);font-family:'Archivo',sans-serif;background:
 linear-gradient(var(--rule) 1px,transparent 1px) 0 0/120px 120px,
 linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/120px 120px,var(--paper)}
.top{position:absolute;left:120px;right:120px;top:72px;display:flex;justify-content:space-between;font:500 20px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tag{position:absolute;left:120px;top:250px;font:500 24px 'JetBrains Mono',monospace;color:var(--accent);letter-spacing:.1em}
h1{position:absolute;left:112px;top:300px;font-weight:900;font-size:168px;line-height:.9;letter-spacing:-.035em;max-width:1300px}
h1 span{color:var(--accent)}
.sub{position:absolute;left:120px;top:690px;font-size:36px;color:var(--muted);max-width:900px;line-height:1.35}
.chain{position:absolute;left:120px;bottom:120px;display:flex;align-items:center}
.blk{width:170px;height:96px;border:2px solid var(--ink);padding:14px 16px;font:500 16px 'JetBrains Mono',monospace;color:var(--muted);background:var(--paper)}
.blk b{display:block;color:var(--ink);font-size:20px;margin-bottom:8px}
.blk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.blk.on b{color:var(--accent-ink)}
.link{width:56px;height:2px;background:var(--ink)}
.who{position:absolute;right:120px;bottom:120px;text-align:right;font:500 22px 'JetBrains Mono',monospace;color:var(--muted);line-height:1.7}
.who b{color:var(--ink);font-weight:500}

.stack{position:absolute;left:120px;top:220px;width:1500px}.stack>*{position:static!important}.stack h1{font-size:200px;margin:24px 0 0 -8px}.stack .sub{margin-top:40px;max-width:1180px}
</style></head><body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage">
<section class="slide active"><div class="top reveal d1"><span>MSBT · Blockchain Seminar</span><span>Group 04 · 2026</span></div>
<div class="stack"><p class="tag reveal d1">// Research presentation</p>
<h1 class="reveal d2">Tokenized<br>deposits<span>.</span></h1>
<p class="sub reveal d3">Programmable money for banks: how commercial bank money moves on-chain, and what it means for settlement and stablecoins.</p></div>
<div class="chain reveal d4"><div class="blk"><b>#1024</b>0x9f…a31c</div><div class="link"></div><div class="blk"><b>#1025</b>0x4b…07e2</div><div class="link"></div><div class="blk on"><b>#1026</b>0xc1…d9f0</div></div>
<div class="who reveal d4"><b>Presented by Your Name</b><br>13 October 2026</div></section>
</main></div>
<script>
/* Stage scaling + theme toggle (press D, or ?theme=dark) */
const st=document.getElementById('deckStage');
const fit=()=>{const f=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;};
fit();addEventListener('resize',fit);
if(new URLSearchParams(location.search).get('theme')==='dark')document.documentElement.classList.add('dark');
addEventListener('keydown',e=>{if(e.key==='d'||e.key==='D')document.documentElement.classList.toggle('dark');});
requestAnimationFrame(()=>document.querySelector('.slide').classList.add('visible'));
</script></body></html>

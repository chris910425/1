<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.slide.visible .reveal{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.25s}.d3{transition-delay:.4s}.d4{transition-delay:.55s}
.theme-hint{position:fixed;right:16px;bottom:12px;font:12px monospace;opacity:.45;color:var(--ink);z-index:5}

:root{--paper:#e9ebe4;--ink:#0e0f0c;--muted:#5e6158;--rule:rgba(14,15,12,.16);--accent:#b6e400;--cell:#d7dacf;--on-accent:#0e0f0c;--stage-bg:var(--paper);--slide-bg:var(--paper)}
:root.dark{--paper:#0c0d0b;--ink:#eef1e6;--muted:#878b7e;--rule:rgba(238,241,230,.14);--accent:#c8ff1a;--cell:#1a1c17;--on-accent:#0c0d0b}
.slide{color:var(--ink);font-family:'IBM Plex Mono',monospace;background:var(--paper)}
.bar{position:absolute;left:0;right:0;top:0;height:84px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:40px;padding:0 100px;font-size:20px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.bar .live{display:flex;align-items:center;gap:12px;color:var(--ink)}.bar .live i{width:14px;height:14px;background:var(--accent);display:inline-block;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.bar .r{margin-left:auto}
.prompt{position:absolute;left:100px;top:210px;font-size:26px;color:var(--muted)}.prompt b{color:var(--ink);font-weight:500}
h1{position:absolute;left:96px;top:270px;font-family:'Unbounded',sans-serif;font-weight:800;font-size:116px;line-height:1.02;letter-spacing:-.03em;text-transform:uppercase;max-width:1150px}
h1 mark{background:var(--accent);color:var(--on-accent);padding:0 14px}
.sub{position:absolute;left:100px;top:700px;font-size:30px;color:var(--muted);max-width:980px;line-height:1.5}
.grid{position:absolute;right:100px;top:210px;display:grid;grid-template-columns:repeat(6,82px);gap:10px}
.grid div{height:82px;background:var(--cell)}.grid .on{background:var(--accent)}.grid .ink{background:var(--ink)}
.foot{position:absolute;left:100px;right:100px;bottom:70px;display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding-top:24px;font-size:22px;color:var(--muted)}.foot b{color:var(--ink);font-weight:500}

.stack{position:absolute;left:100px;top:200px;width:1120px}.stack>*{position:static!important}.stack h1{font-size:120px;margin:36px 0 0 -4px}.stack .sub{margin-top:48px}
</style></head><body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage">
<section class="slide active"><div class="bar reveal d1"><span class="live"><i></i>MSBT</span><span>Blockchain Seminar</span><span class="r">Block 04 / 2026</span></div>
<div class="stack"><p class="prompt reveal d1">&gt; <b>query</b> --topic tokenized_deposits</p>
<h1 class="reveal d2">Tokenized <mark>deposits</mark></h1>
<p class="sub reveal d3">Programmable bank money: how commercial bank money moves on-chain, and what it means for settlement and stablecoins.</p></div>
<div class="grid reveal d3"><div class="ink"></div><div class=""></div><div class=""></div><div class="on"></div><div class=""></div><div class=""></div><div class=""></div><div class="on"></div><div class=""></div><div class=""></div><div class="ink"></div><div class=""></div><div class=""></div><div class=""></div><div class="on"></div><div class=""></div><div class=""></div><div class="on"></div><div class="on"></div><div class=""></div><div class=""></div><div class="ink"></div><div class=""></div><div class=""></div><div class=""></div><div class=""></div><div class="on"></div><div class=""></div><div class=""></div><div class="ink"></div><div class=""></div><div class=""></div><div class=""></div><div class="on"></div><div class=""></div><div class=""></div></div>
<div class="foot reveal d4"><span>Presented by <b>Your Name</b></span><span>13.10.2026</span><span>hash 0x7e…c4a1</span></div></section>
</main></div>
<script>
/* Stage scaling + theme toggle (press D, or ?theme=dark) */
const st=document.getElementById('deckStage');
const fit=()=>{const f=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;};
fit();addEventListener('resize',fit);
if(new URLSearchParams(location.search).get('theme')==='dark')document.documentElement.classList.add('dark');
addEventListener('keydown',e=>{if(e.key==='d'||e.key==='D')document.documentElement.classList.toggle('dark');});
requestAnimationFrame(()=>document.querySelector('.slide').classList.add('visible'));
</script></body></html>
